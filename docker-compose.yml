name: helpdesk

services:
  php:
    build:
      context: ./php
    image: helpdesk-php:latest
    container_name: helpdesk_php
    working_dir: /var/www/html
    environment:
      PROJECT_NAME: ${PROJECT_NAME:-helpdesk}
      XDEBUG: "false"
    volumes:
      - ./src:/var/www/html
      - ./php/www.conf:/usr/local/etc/php-fpm.d/www.conf:ro
      - ./php/local.ini:/usr/local/etc/php/conf.d/local.ini:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - helpdesk
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
    image: helpdesk-nginx:latest
    container_name: helpdesk_nginx
    ports:
      - "${NGINX_HTTP_PORT:-8083}:80"
      - "${NGINX_HTTPS_PORT:-8444}:443"
    volumes:
      - ./src:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - php
    networks:
      - helpdesk
    restart: unless-stopped

  db:
    image: mariadb:10.11
    container_name: helpdesk_db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-helpdesk}
      MARIADB_USER: ${DB_USERNAME:-helpdesk}
      MARIADB_PASSWORD: ${DB_PASSWORD:-helpdesk_secret}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-helpdesk_root_secret}
      TZ: Asia/Jakarta
    ports:
      - "${DB_FORWARD_PORT:-13308}:3306"
    volumes:
      - ./db/data:/var/lib/mysql
      - ./db/conf.d:/etc/mysql/conf.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p$$MARIADB_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - helpdesk

networks:
  helpdesk:
    name: helpdesk_network
    driver: bridge

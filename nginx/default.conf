# Redirect HTTP to HTTPS (host port 8083 -> 8444)
server {
    listen 80;
    listen [::]:80;
    server_name helpdesk.test localhost 127.0.0.1;

    return 301 https://$host:8444$request_uri;
}

# HTTPS server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_tokens off;

    server_name helpdesk.test localhost 127.0.0.1;
    root /var/www/html/public;

    index index.php index.html;
    client_max_body_size 128M;

    ssl_certificate     /etc/nginx/ssl/helpdesk.test.crt;
    ssl_certificate_key /etc/nginx/ssl/helpdesk.test.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 300s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
